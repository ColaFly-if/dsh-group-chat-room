<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊天群组</title>
<style>
  :root{ --bg:#14161b; --panel:#1a1d24; --line:#262a33; --text:#e6e8ee; --dim:#8b93a5; --me:#2b5fa8; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{ background:var(--bg); color:var(--text);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden; position:relative; }
  header{ flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:9px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  header .spacer{flex:1}
  header button{ background:transparent; border:1px solid var(--line); color:var(--dim);
    border-radius:8px; padding:3px 9px; font-size:12px; cursor:pointer; }
  header button:hover{border-color:#3a4150; color:var(--text)}
  .gear-wrap{position:relative; flex:0 0 auto}
  #gearBtn{width:26px; padding:0; text-align:center; font-size:14px; line-height:1}
  .gear-menu{display:none; position:absolute; right:0; top:calc(100% + 6px); z-index:40;
    min-width:158px; padding:5px; background:#1b1f27; border:1px solid var(--line);
    border-radius:10px; box-shadow:0 10px 28px rgba(0,0,0,.45)}
  .gear-menu.on{display:block}
  .gear-menu button{display:block; width:100%; text-align:left; border:0; padding:7px 9px;
    font-size:13px; border-radius:7px; color:var(--text); background:transparent}
  .gear-menu button:hover{background:#262b36}
  .gear-menu button.danger{color:#ff9a9a}
  .gear-menu button.danger:hover{background:#3a2027}
  #groupSel{ background:#22262f; color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:4px 8px; font-size:13px; font-weight:600; outline:none; max-width:150px; }
  #groupSel:focus{border-color:#3d4658}
  #newGroup{ border-color:#3d6fa8; color:#9ec7ff; font-weight:600; }
  #newGroup:hover{ background:#1d2634; color:#cfe4ff; }

  main{ flex:1 1 auto; overflow-y:auto; padding:14px 12px 6px;
    display:flex; flex-direction:column; gap:12px; }
  main::-webkit-scrollbar{width:8px}
  main::-webkit-scrollbar-thumb{background:#2a2f3a; border-radius:4px}

  .row{display:flex; gap:8px; align-items:flex-start; max-width:100%}
  .row.me{flex-direction:row-reverse}
  .ava{ flex:0 0 30px; width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; background:#20242d; border:1px solid var(--line); }
  .body{display:flex; flex-direction:column; gap:3px; min-width:0; max-width:82%}
  .row.me .body{align-items:flex-end}
  .who{font-size:11px; color:var(--dim); padding:0 3px}
  .bubble{ padding:8px 11px; border-radius:12px; background:#232731;
    border:1px solid #2b3040; white-space:pre-wrap; word-break:break-word;
    font-size:14px; line-height:1.55; }
  .row.me .bubble{background:var(--me); border-color:#356dbf; color:#fff}
  .bubble.streaming::after{ content:""; display:inline-block; width:6px; height:14px; margin-left:2px;
    background:currentColor; opacity:.6; vertical-align:-2px; animation:blink 1s steps(2,start) infinite; }
  @keyframes blink{50%{opacity:0}}
  .tick{font-size:10px; color:#6b7385}
  .skipped{font-size:11px; color:#5d6474; padding-left:3px}

  footer{ flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel); padding:10px 12px 12px; }
  .chips{display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap}
  .chip{ font-size:12px; padding:3px 9px; border-radius:999px; cursor:pointer;
    background:#20242d; border:1px solid var(--line); color:var(--dim); }
  .chip:hover{color:var(--text); border-color:#3a4150}
  .inputbar{display:flex; gap:8px; align-items:flex-end}
  textarea{ flex:1; resize:none; min-height:38px; max-height:120px; padding:9px 11px;
    border-radius:10px; background:#22262f; border:1px solid var(--line);
    color:var(--text); font:inherit; outline:none; }
  textarea:focus{border-color:#3d4658}
  #send{ flex:0 0 auto; height:38px; padding:0 16px; border-radius:10px; border:0;
    background:var(--me); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  #send:disabled{opacity:.45; cursor:default}
  .typing{font-size:12px; color:var(--dim); padding:0 4px 6px; height:18px}

  #picker{ position:absolute; inset:0; z-index:20; background:rgba(10,12,16,.9);
    backdrop-filter:blur(3px); display:none; flex-direction:column; }
  #picker.open{display:flex}
  .pk-head{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line)}
  .pk-head .t{font-weight:600; font-size:14px}
  .pk-head .spacer{flex:1}
  .pk-head button{ background:transparent; border:1px solid var(--line); color:var(--dim);
    border-radius:8px; padding:3px 9px; font-size:12px; cursor:pointer; }
  .pk-body{flex:1 1 auto; overflow-y:auto; padding:12px 14px}
  .sec{margin-bottom:18px}
  .sec-t{font-size:12px; color:var(--dim); margin-bottom:8px; letter-spacing:.4px}
  .ws-item{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px;
    background:#1b1f27; border:1px solid var(--line); margin-bottom:6px;
    font-size:12px; color:#c3cad8; word-break:break-all; }
  .ws-item .x{ margin-left:auto; cursor:pointer; color:#7a8194; border:0; background:none;
    font-size:14px; line-height:1; padding:2px 4px; }
  .ws-item .x:hover{color:#e5707e}
  .ws-item.dead{border-color:#4a2c34; background:#1f1a1d}
  .ws-item .cnt{margin-left:auto; flex:0 0 auto; font-size:11px; color:#6f7789}
  .ws-item.dead .cnt{color:#e5707e}
  .ws-add{display:flex; gap:6px; margin-top:6px; align-items:flex-start}
  .ws-add textarea{ flex:1; min-height:52px; padding:7px 9px; border-radius:8px; background:#22262f;
    border:1px solid var(--line); color:var(--text); font:12px/1.5 inherit; outline:none; resize:vertical; }
  .ws-add textarea:focus{border-color:#3d4658}
  .ws-add button{ flex:0 0 auto; padding:7px 12px; border-radius:8px; border:1px solid var(--line);
    background:#22262f; color:var(--text); font-size:12px; cursor:pointer; }
  .ws-add .col{ display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }

  #browser{ position:absolute; inset:0; z-index:30; background:rgba(8,10,13,.94);
    backdrop-filter:blur(4px); display:none; flex-direction:column; }
  #browser.open{display:flex}
  .br-path{ flex:0 0 auto; padding:8px 14px; font-size:12px; color:#a8b0c0;
    border-bottom:1px solid var(--line); background:#161920; word-break:break-all; }
  .br-dir{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px;
    background:#1b1f27; border:1px solid var(--line); margin-bottom:6px; cursor:pointer; font-size:13px; }
  .br-dir:hover{border-color:#3d6fa8; background:#1d2634}
  .br-dir.hidden-dir{opacity:.55}
  .br-dir .nm{flex:1; word-break:break-all}
  .br-dir .tag{ font-size:11px; color:#5fd0a0; flex:0 0 auto; }
  .br-dir .tag.none{color:#5b6273}
  .addrow{display:flex; gap:6px; margin-top:6px}
  .addrow input{ flex:1; padding:6px 9px; border-radius:8px; background:#22262f;
    border:1px solid var(--line); color:var(--text); font-size:12px; outline:none; }
  .addrow input:focus{border-color:#3d4658}
  .addrow button,.pk-foot button{ padding:6px 12px; border-radius:8px; border:1px solid var(--line);
    background:#22262f; color:var(--text); font-size:12px; cursor:pointer; }
  .addrow button:hover,.pk-foot button:hover{border-color:#3a4150}

  .person{ display:flex; gap:10px; align-items:flex-start; padding:9px 10px;
    border-radius:10px; background:#1b1f27; border:1px solid var(--line);
    margin-bottom:7px; cursor:pointer; }
  .person.on{border-color:#3d6fa8; background:#1d2634}
  .person input{margin-top:3px}
  .person .nm{font-size:13px; font-weight:600}
  .person .ws{font-size:11px; color:#6f7789; margin-left:6px; font-weight:400}
  .person .ex{font-size:11px; color:#8b93a5; margin-top:2px; line-height:1.45}
  .empty{font-size:12px; color:#6f7789; padding:8px 2px}

  .pk-foot{ flex:0 0 auto; display:flex; gap:8px; align-items:center;
    padding:10px 14px; border-top:1px solid var(--line); }
  .pk-foot .spacer{flex:1}
  .pk-foot .primary{background:var(--me); border-color:#356dbf; color:#fff; font-weight:600}
  .pk-foot .danger{color:#e5707e; border-color:#4a2c34}
  .pk-foot .danger:hover{border-color:#743b45}
  .pk-foot .danger.armed{ background:#4a2c34; border-color:#e5707e; color:#ffd9df; font-weight:600; }

  .grow{ display:flex; flex-direction:column; gap:4px; padding:9px 10px; border-radius:10px;
    background:#1b1f27; border:1px solid var(--line); margin-bottom:7px; }
  .grow.cur{ border-color:#3d6fa8; background:#1d2634; }
  .grow .top{ display:flex; align-items:center; gap:6px; }
  .grow .nm{ font-size:13px; font-weight:600; word-break:break-all; }
  .grow .badge{ font-size:10px; padding:1px 6px; border-radius:999px;
    background:#2a4667; color:#9ec7ff; flex:0 0 auto; }
  .grow .meta{ font-size:11px; color:#6f7789; }
  .grow .ops{ display:flex; gap:6px; margin-top:3px; }
  .grow .ops button{ padding:3px 9px; border-radius:7px; border:1px solid var(--line);
    background:#22262f; color:#c3cad8; font-size:11px; cursor:pointer; }
  .grow .ops button:hover{ border-color:#3a4150; color:var(--text); }
  .grow .ops .del{ color:#e5707e; border-color:#4a2c34; }
  .grow .ops .del.armed{ background:#4a2c34; color:#ffd9df; font-weight:600; }
  .grow .edit{ display:flex; gap:6px; margin-top:2px; }
  .grow .edit input{ flex:1; padding:5px 8px; border-radius:7px; background:#22262f;
    border:1px solid var(--line); color:var(--text); font-size:12px; outline:none; }
  .grow .edit input:focus{ border-color:#3d4658; }

  .person .gear{ margin-left:auto; flex:0 0 auto; padding:2px 7px; border-radius:6px;
    border:1px solid var(--line); background:#22262f; color:#8b93a5; font-size:12px; cursor:pointer; }
  .person .gear:hover{ color:var(--text); border-color:#3a4150; }
  .person .tagline{ font-size:11px; color:#5fd0a0; margin-top:2px; }
  .person .off{ color:#e5707e; }
  .botedit{ display:flex; flex-direction:column; gap:6px; padding:10px; margin:2px 0 8px;
    border-radius:10px; background:#161a21; border:1px solid #2f3644; }
  .botedit .f{ display:flex; gap:6px; align-items:center; }
  .botedit .f label{ flex:0 0 44px; font-size:11px; color:#8b93a5; }
  .botedit .f input[type=text]{ flex:1; padding:5px 8px; border-radius:7px; background:#22262f;
    border:1px solid var(--line); color:var(--text); font-size:12px; outline:none; }
  .botedit .f input[type=text]:focus{ border-color:#3d4658; }
  .botedit .skl{ display:flex; flex-direction:column; gap:4px; margin-top:2px; }
  .botedit .skl label{ display:flex; gap:6px; align-items:flex-start; font-size:12px; color:#c3cad8;
    flex:0 0 auto; cursor:pointer; padding:4px 6px; border-radius:6px; background:#1b1f27; }
  .botedit .skl label:hover{ background:#1d2634; }
  .botedit .skl .sd{ color:#6f7789; font-size:11px; }
  .botedit .act{ display:flex; gap:6px; margin-top:2px; }
  .botedit .act button{ padding:4px 11px; border-radius:7px; border:1px solid var(--line);
    background:#22262f; color:#c3cad8; font-size:12px; cursor:pointer; }
  .botedit .act .save{ background:#2b5fa8; border-color:#356dbf; color:#fff; font-weight:600; }
.sticker-panel{display:none;max-height:190px;overflow:auto;border-top:1px solid #eee;padding:6px 8px;background:#fafafa}
.sticker-panel.on{display:block}
.sticker-panel .pk-t{font-size:11px;color:#888;margin:6px 0 4px}
.st-grid{display:flex;flex-wrap:wrap;gap:6px}
.st-grid img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#fff;cursor:pointer;border:1px solid #eee}
.st-grid img:hover{border-color:#4a9eff}
img.sticker{width:112px;height:112px;object-fit:contain;display:block;margin:2px 0}
.bubble.only-st{display:none}
#stickerBtn{width:38px;height:38px;min-width:38px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:17px;line-height:1;flex:0 0 auto}
</style>
</head>
<body>
  <header>
    <select id="groupSel"></select>
    <button id="newGroup" title="新建一个群">+ 新群</button>
    <button id="members">成员 <span id="mcount">0</span></button>
    <span class="spacer"></span>
    <div class="gear-wrap">
      <button id="gearBtn" title="设置">⚙</button>
      <div id="gearMenu" class="gear-menu">
        <button id="menuReset" class="danger">清空聊天记录</button>
      </div>
    </div>
  </header>

  <main id="list"></main>

  <footer>
    <div class="chips" id="chips"></div>
    <div class="typing" id="typing"></div>
    <div id="stickerPanel" class="sticker-panel"></div>
    <div class="inputbar">
      <button id="stickerBtn" title="表情包">🙂</button>
      <textarea id="ta" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </div>
  </footer>

  <div id="browser">
    <div class="pk-head">
      <span class="t">选择目录</span>
      <span class="spacer"></span>
      <button id="brClose">关闭</button>
    </div>
    <div class="br-path" id="brPath"></div>
    <div class="pk-body" id="brList"></div>
    <div class="pk-foot">
      <button id="brUp">↑ 上一级</button>
      <span class="spacer"></span>
      <button id="brAdd" class="primary">添加这个目录</button>
    </div>
  </div>

  <div id="picker">
    <div class="pk-head">
      <span class="t" id="pkTitle">群设置</span>
      <span class="spacer"></span>
      <button id="pkClose">关闭</button>
    </div>
    <div class="pk-body">
      <div class="sec">
        <div class="sec-t">群管理 <span id="gCount"></span></div>
        <div id="gList"></div>
        <div class="addrow" style="margin-top:8px">
          <input id="groupName" placeholder="新群名字">
          <button id="groupCreate">新建</button>
        </div>
        <div class="addrow" style="margin-top:6px">
          <input id="groupDesc" placeholder="当前群的简介，成员会读到">
          <button id="groupDescBtn">保存简介</button>
        </div>
      </div>
      <div class="sec">
        <div class="sec-t">AI 生成成员 / 群</div>
        <textarea id="forgeDesc" rows="2" placeholder="描述你要的群，例：一个程序开发组，要有产品、前端、后端、测试、设计"></textarea>
        <div class="addrow" style="margin-top:6px">
          <input id="forgeWs" placeholder="写到哪个工作区（留空=第一个）">
          <button id="forgeGroup" class="primary">建群 + 成员</button>
          <button id="forgeMember">只加一个成员</button>
        </div>
        <div id="forgeMsg" style="font-size:12px;color:#888;margin-top:6px"></div>
      </div>
      <div class="sec">
        <div class="sec-t">扫描的工作区</div>
        <div id="wsList"></div>
        <div class="ws-add">
          <textarea id="wsInput" rows="2" placeholder="可以一次贴多个，换行 / 分号 / 逗号都认&#10;例如：/path/to/workspace-a; /path/to/workspace-b"></textarea>
          <div class="col">
            <button id="wsAdd">批量添加</button>
            <button id="wsBrowse">浏览…</button>
          </div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-t">本群成员 <span id="pCount"></span></div>
        <div id="pList"></div>
      </div>
    </div>
    <div class="pk-foot">
      <button id="selAll">全选</button>
      <button id="selNone">全不选</button>
      <span class="spacer"></span>
      <button id="groupDelete" class="danger">删群</button>
      <button id="pkSave" class="primary">保存成员</button>
    </div>
  </div>

<script>
(function () {
  var MEMBERS = { user: { name: '可乐', avatar: '👤', color: '#2b5fa8' } };
  var ROSTER = [];
  var GROUP = null;
  var GROUPS = [];

  var list = document.getElementById('list');
  var ta = document.getElementById('ta');
  var sendBtn = document.getElementById('send');
  var typingEl = document.getElementById('typing');
  var chipsEl = document.getElementById('chips');
  var mcountEl = document.getElementById('mcount');
  var groupSel = document.getElementById('groupSel');
  var streaming = {};
  var typingWho = {};

  var picker = document.getElementById('picker');
  var pkTitle = document.getElementById('pkTitle');
  var wsList = document.getElementById('wsList');
  var pList = document.getElementById('pList');
  var pCount = document.getElementById('pCount');
  var wsInput = document.getElementById('wsInput');
  var groupName = document.getElementById('groupName');
  var groupRename = document.getElementById('groupRename');
  var disc = { workspaces: [], personas: [], selected: [] };
  var BOTS = [];
  var SKILLS = [];
  var editingBotId = null;

  async function jget(path, opts) {
    var r = await fetch(path, opts);
    var t = await r.text();
    try { return JSON.parse(t); }
    catch (e) {
      var msg = t && t.length < 80 ? t.trim() : ('HTTP ' + r.status);
      throw new Error('后端没有这个接口（' + msg + '）');
    }
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function hhmm(ts) { var d = new Date(ts||Date.now()); var h=d.getHours(), m=d.getMinutes(); return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
  function scrollDown() { list.scrollTop = list.scrollHeight; }
  function metaOf(id) { return MEMBERS[id] || { name: id, avatar: '·', color: '#666' }; }

  function stickerImg(id) {
    var im = el("img", "sticker");
    im.src = "/api/memes/assets/" + encodeURIComponent(id) + "?size=150";
    im.alt = "表情"; im.title = id; im.loading = "lazy";
    return im;
  }

  function addMessage(m) {
    var who = m.who, meta = metaOf(who);
    var row = el('div', 'row' + (who === 'user' ? ' me' : ''));
    var ava = el('div', 'ava', meta.avatar);
    var body = el("div", "body");
    if (who !== "user") body.appendChild(el("div", "who", meta.name));
    if (m.sticker) body.appendChild(stickerImg(m.sticker));
    var b = el("div", "bubble" + (m.text ? "" : " only-st"), m.text || "");
    if (who === "user") b.appendChild(el("div", "tick", " " + hhmm(m.ts)));
    body.appendChild(b);
    row.appendChild(ava); row.appendChild(body);
    list.appendChild(row); scrollDown();
    return b;
  }

  function renderTyping() {
    var names = Object.keys(typingWho).filter(function (k) { return typingWho[k]; });
    typingEl.textContent = names.length ? names.map(function (k) { return metaOf(k).name; }).join('、') + ' 正在输入…' : '';
  }

  function handle(ev) {
    var t = ev.type;
    if (t === 'user_msg') return;
    if (t === 'typing') { typingWho[ev.who] = !!ev.on; renderTyping(); return; }
    if (t === 'msg_start') {
      var b = addMessage({ who: ev.who, text: '', ts: Date.now() });
      b.classList.add('streaming'); streaming[ev.who] = b; return;
    }
    if (t === 'delta') {
      var b2 = streaming[ev.who];
      if (!b2) { b2 = addMessage({ who: ev.who, text: '', ts: Date.now() }); b2.classList.add('streaming'); streaming[ev.who] = b2; }
      b2.textContent += ev.text; scrollDown(); return;
    }
    if (t === "msg_end") {
      var b3 = streaming[ev.who];
      if (!b3) b3 = addMessage({ who: ev.who, text: "", ts: Date.now() });
      if (b3) {
        b3.textContent = ev.text || "";
        b3.classList.remove("streaming");
        if (ev.sticker) {
          var holder = b3.parentNode;
          if (holder) holder.insertBefore(stickerImg(ev.sticker), b3);
          if (!ev.text) b3.classList.add("only-st");
        }
        delete streaming[ev.who];
      }
      scrollDown(); return;
    }
    if (t === 'skipped') {
      return; // 内部调度细节不上屏
      var row = el('div', 'row');
      row.appendChild(el('div', 'ava', metaOf(ev.who).avatar));
      var bd = el('div', 'body');
      bd.appendChild(el('div', 'skipped', metaOf(ev.who).name + ' 没接话'));
      row.appendChild(bd); list.appendChild(row); scrollDown(); return;
    }
    if (t === 'error') {
      var r2 = el('div', 'row'); var bd2 = el('div', 'body');
      bd2.appendChild(el('div', 'skipped', '［出错了］' + (ev.text || '')));
      r2.appendChild(bd2); list.appendChild(r2); scrollDown();
    }
  }

  function setBusy(on) { sendBtn.disabled = on; sendBtn.textContent = on ? '…' : '发送'; }

  function buildChips() {
    chipsEl.innerHTML = '';
    if (ROSTER.length > 1) {
      var d = el('span', 'chip', '你们几个聊');
      d.addEventListener('click', function () { ta.value = '你们几个聊会儿，我听着'; ta.focus(); });

  async function send(extra) {
    var payload = extra || null;
    // 防御：若被当成事件处理器调用，extra 会是 Event，一律忽略
    if (payload && (payload instanceof Event || typeof payload.preventDefault === 'function')) payload = null;
    if (!payload) {
      var text = ta.value.trim();
      if (!text || !GROUP) return;
      ta.value = ""; ta.style.height = "auto";
      addMessage({ who: "user", text: text, ts: Date.now() });
      payload = { text: text, group: GROUP.id };
    } else if (!GROUP) return;
    setBusy(true);
    // 整段读取会等到服务端说完才回来，中间给个可见提示，别让人以为没反应
    var waitNote = el('div', 'row');
    var waitBody = el('div', 'body');
    waitBody.appendChild(el('div', 'skipped', '…等他们回话'));
    waitNote.appendChild(waitBody); list.appendChild(waitNote); scrollDown();
    try {
      var res = await fetch("api/say", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok || !res.body) {
        var e = await res.text();
        var row = el('div', 'row'); var b = el('div', 'body');
        b.appendChild(el('div', 'skipped', '［请求失败］' + e));
        row.appendChild(b); list.appendChild(row); setBusy(false); return;
      }
      // 有的运行环境会把 SSE 整段缓冲到结束才交给浏览器，逐块读会拿到空流，\r\n      // 于是「发完没反应、刷新才看到」。这里直接取完整响应，再按事件逐条渲染。\r\n      var raw = await res.text();\r\n      var parts = raw.split("\n\n");\r\n      for (var k = 0; k < parts.length; k += 1) {\r\n        var chunk = parts[k].trim();\r\n        if (chunk.indexOf("data:") !== 0) continue;\r\n        try { handle(JSON.parse(chunk.slice(5).trim())); } catch (err) {}\r\n      }\r\n      var reader = null, dec = null, buf = "";
      // 整段读取响应再逐条渲染：有的环境会把 SSE 缓冲到结束，逐块读会拿到空流
      var raw = await res.text();
      var parts = raw.split("\n\n");
      for (var k = 0; k < parts.length; k += 1) {
        var chunk = parts[k].trim();
        if (chunk.indexOf("data:") !== 0) continue;
        try { handle(JSON.parse(chunk.slice(5).trim())); }
        catch (err) { var er = el('div','row'); var eb = el('div','body');
          eb.appendChild(el('div','skipped','［渲染失败］' + (err && err.message)));
          er.appendChild(eb); list.appendChild(er); }
      }
      while (false) {
        var step = await reader.read(); if (step.done) break;
        buf += dec.decode(step.value, { stream: true });
        var i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          var chunk = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
          if (chunk.indexOf('data:') !== 0) continue;
          try { handle(JSON.parse(chunk.slice(5).trim())); } catch (err) {}
        }
      }
    } catch (err) {
      var r2 = el('div', 'row'); var b2 = el('div', 'body');
      b2.appendChild(el('div', 'skipped', '［网络错误］' + err.message));
      r2.appendChild(b2); list.appendChild(r2);
    }
    if (waitNote && waitNote.parentNode) waitNote.parentNode.removeChild(waitNote);
    // 兜底：不管流式成功与否，统一以历史接口为准重绘一次（刷新能看到 = 这条一定能拿到）
    try { await loadHistory(); } catch (e) {}
    typingWho = {}; renderTyping(); setBusy(false);
  }

  // 不用弹窗：第一下变成确认，4 秒内再点一下才真清
  menuReset.addEventListener("click", async function () {
    if (!GROUP) { closeGear(); return; }
    if (!armResetTimer) {
      menuReset.textContent = "再点一次确认清空";
      armResetTimer = setTimeout(function () {
        armResetTimer = null;
        menuReset.textContent = resetLabel;
      }, 4000);
      return;
    }
    closeGear();
    await fetch("api/reset?g=" + encodeURIComponent(GROUP.id), { method: "POST" });
    list.innerHTML = "";
  });

  (async function boot() {
    try { await loadState(); } catch (e) {}
    await loadHistory();
    ta.focus();
  })();
})();
</script>
</body>
</html>
